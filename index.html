<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✓작업꾸러미✓</title>
    <!-- 오트밀색 배경을 화면 전체에: 폰 상단(시간/배터리 줄)·하단 브라우저 바 색은 theme-color 와 html 배경색을 따라감 -->
    <meta name="theme-color" content="#f5f3ee">
    <meta name="color-scheme" content="light">
    <style>html, body {background:#f5f3ee;}</style>
    <link rel="stylesheet" href="css/reset.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fullPage.js/4.0.9/vendors/easings.min.js"></script>
    <link rel="stylesheet" href="css/style_2.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Inter:wght@400;500&family=Noto+Serif+KR:wght@400;500&display=swap">
    <link rel="stylesheet" href="css/ai.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/fullPage.js/3.1.2/fullpage.min.css">
    <link rel="shortcut icon" href="./img/favi.png">

    <script src="js/jquery-3.6.0.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fullPage.js/3.1.2/fullpage.min.js"></script>
    <script src="js/iscroll.js"></script>
    <script>
        // 이 페이지 전용 fullpage 설정 (js/main.js의 기본값을 덮어씀)
        // 섹션을 추가하면 아래 세 배열에도 항목을 같은 순서로 추가해 주세요.
        // (스키마리딩 / 디자인 작업물(윤동주 문학제) 섹션은 비활성화 중: 다시 쓰려면 아래 배열에 'schema', 'design' 항목을 추가하고 HTML 주석을 풀어 주세요.
        //  anchors: ['portfolio', 'schema', 'design'] / navigationTooltips: [..., '스키마리딩', '디자인 작업물'] / sectionsColor: [..., '#000000', '#000000'] / navigation: true)
        window.fullpageOverrides = {
            anchors: ['portfolio'],
            navigationTooltips: ['AI 모델 이미지'],
            sectionsColor: ['#f5f3ee'],
            navigation: false,   // 섹션이 하나뿐이라 오른쪽 점 내비게이션 숨김
            responsiveWidth: 99999   // 화면 크기와 상관없이 한 화면 고정 대신 일반 스크롤 (타일이 아래로 이어서 생김)
        };
    </script>
    <script defer src="js/main.js"></script>
</head>
<body>
    <header>
        <div class="header_in">
                <h1><a href="index.html">logo</a></h1>
                    <div class="gnb_wrap">
                        <div class="gnb_list_w">
                            <ul class="gnb_list">
                                <!-- HOME 메뉴: 소개 화면이 없어지면서 첫 화면이 곧 포트폴리오라 중복되어 숨김 (로고를 누르면 맨 위로 이동) -->
                                <!-- ABOUT 비활성화 <li data-menuanchor="2nd"><a class="mitem" href="#2nd">ABOUT</a></li> -->
                                <li data-menuanchor="portfolio"><a class="mitem" href="#portfolio">PORTFOLIO</a></li>
                                <li data-menuanchor="4th"><a class="mitem" href="contact.html">CONTACT</a></li>
                            </ul>
                        </div>
                        <div class="sideMenu">
                            <svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" fill="white" class="bi bi-list" viewBox="0 0 16 16">
                                <path fill-rule="evenodd" d="M2.5 12a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5zm0-4a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5zm0-4a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5z"/>
                            </svg>
                        </div>
                    </div>
                    <div class="side">
                        <div style="display:flex; justify-content: flex-end;">
                            <svg id="sideOff" xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-x-lg" viewBox="0 0 16 16">
                                <path d="M2.146 2.854a.5.5 0 1 1 .708-.708L8 7.293l5.146-5.147a.5.5 0 0 1 .708.708L8.707 8l5.147 5.146a.5.5 0 0 1-.708.708L8 8.707l-5.146 5.147a.5.5 0 0 1-.708-.708L7.293 8 2.146 2.854Z"/>
                              </svg>
                        </div>
                        <ul style="display: flex; flex-direction: column; gap:20px;">
                            <!-- ABOUT 비활성화 <li><a href="index.html#second">ABOUT</a></li> -->
                            <li><a href="#portfolio">PORTFOLIO</a></li>
                            <li><a href="contact.html">CONTACT</a></li>
                        </ul>
                    </div>
        </div>
    </header>

    <div id="fullpage">

        <!-- 소개 화면 비활성화 (다시 쓰려면 아래 주석을 풀고, 위 anchors/navigationTooltips/sectionsColor 맨 앞에 'home' 항목을 추가하세요)
        <div class="section" id="s1">
            <div class="image_w">
                <img src="img/main_home.jpg" alt="">
            </div>
            <div class="s1_w">
                <div class="s1_in">
                    <div class="s1_main"><span>열린 태도로 함께 성장하는</span>웹디자이너 강의원입니다</div>
                    <div class="s1_sub">쉼 없이 변화하는 웹 환경에  최적화하는<br>웹 디자이너가 되겠습니다.</div>
                </div>
            </div>
        </div>
        -->

        <!-- AI 모델 이미지 & 상세페이지 (작업물 목록은 js/ai_works.js 에서 관리) -->
        <div class="section fp-auto-height-responsive" id="sAi">
            <div class="ai_w">
                <aside class="ai_side">
                    <h2 class="ai_title">AI Model Images &amp; Detail Pages</h2>
                    <p class="ai_sub">AI 모델 이미지 &amp; 상세페이지 작업물</p>
                    <div class="ai_browse">Browse by</div>
                    <ul class="ai_filters" id="aiFilters"></ul>
                </aside>
                <div class="ai_main">
                    <div class="ai_topbar">
                        <span class="ai_count" id="aiCount"></span>
                        <div class="ai_pager" id="aiPager"></div>
                    </div>
                    <div class="ai_grid" id="aiGrid"></div>
                </div>
            </div>
        </div>

        <!-- 스키마리딩 섹션 비활성화 (다시 쓰려면 이 주석을 풀고, 위 fullpageOverrides 에 'schema' 항목을 추가하세요)
        <div class="section" id="s0">
            <div class="image_w">
                <img src="img/schema.png" alt="">
            </div>
            <div class="s0_w">
                <div class="s0_in">
                    <div class="s0_main"><span> 독해학습 프로그램 <br> 스키마리딩 </span></div>
                    <div class="s0_sub">랜딩 페이지와 프로그램 전반 디자인 </div>
                    <div class="s0_sub">CSS3 / HTML5 / Javascript <br> </div>

                    <div class="s0_btn_w">
                        <a href="./01 schema/landing/index.html" target="_blank" class="s0_btn"><span>페이지로 이동</span></a>
                    </div>
                </div>
            </div>
        </div>
        -->

        <!-- 디자인 작업물(윤동주 문학제, hgu.html 연결) 섹션 비활성화 (다시 쓰려면 이 주석을 풀고, 위 fullpageOverrides 에 'design' 항목을 추가하세요)
        <div class="section" id="s5">
                <div class="s5_title">
                    <p>디자인 작업물</p>
                </div>

                <div class="s5_btn_w">
                    <a href="hgu.html" target="_blank" class="s5_btn"><span>더 보기</span></a>
                </div>

            ※ 영상은 PC에서만 불러와 재생(아래 스크립트). 휴대폰/태블릿은 poster 이미지만 표시
            <video muted loop playsinline preload="none" poster="img/vid03_poster.jpg" data-src="vid/vid03.mp4"></video>
        </div>
        -->
    </div>

    <!-- AI 작업물 상세 팝업 (fullpage 의 transform 영향을 받지 않도록 #fullpage 바깥에 둠) -->
    <div class="ai_modal" id="aiModal" role="dialog" aria-modal="true" aria-hidden="true" aria-label="작업물 상세 보기">
        <div class="ai_modal_bar">
            <button type="button" class="ai_close" aria-label="목록으로 돌아가기">&larr; Back to works</button>
            <div class="ai_modal_ctrl">
                <span class="ai_modal_count"></span>
                <button type="button" class="ai_prev" aria-label="이전 작업물">&lsaquo;</button>
                <button type="button" class="ai_next" aria-label="다음 작업물">&rsaquo;</button>
            </div>
        </div>
        <div class="ai_modal_body">
            <div class="ai_view">
                <div class="ai_gallery"></div>
                <aside class="ai_info"></aside>
            </div>
        </div>
    </div>

    <script src="js/ai_works.js"></script>
    <script src="js/ai.js"></script>

    <script>
        // 배경 영상: 마우스 PC에서만 불러와서 재생, 터치 기기(휴대폰/태블릿)나 좁은 화면에서는 재생/다운로드하지 않음
        (function () {
            var v = document.querySelector('#s5 video');
            if (!v) return;
            var noVideo = window.matchMedia('(max-width: 700px), (hover: none) and (pointer: coarse)').matches;
            if (noVideo) return;
            v.src = v.getAttribute('data-src');
            v.autoplay = true;
            var p = v.play();
            if (p && p.catch) p.catch(function () {});
        })();
    </script>

</body>
</html>
